name: VPN Policy Windows Preview

on:
  push:
    branches:
      - vpn-policy-windows-preview
      - vpn-policy-c8f8-fix
      - vpn-policy-global-09-20261014
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/helper
            plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Focused VPN regression tests
        shell: pwsh
        run: |
          $original = Get-Content pubspec.yaml -Raw
          try {
            $original.Replace('build_assets: true', 'build_assets: false') | Set-Content pubspec.yaml
            flutter test test/features/vpn_policy_full_tunnel_test.dart test/features/vpn_policy_profile_bootstrap_test.dart test/features/vpn_policy_local_policy_test.dart test/providers/setup_action_test.dart test/database/migration_v1_to_v2_test.dart
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $original | Set-Content pubspec.yaml
          }

      - name: Build Windows release bundle
        run: flutter build windows --release

      - name: Stamp VPN Policy build
        shell: pwsh
        run: |
          "VPN Policy 0.9.0`nCommit: ${{ github.sha }}`nBuilt: $(Get-Date -Format o)" | Set-Content build/windows/x64/runner/Release/VPN-POLICY-BUILD.txt

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-VPN-Policy-Windows-preview
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 7